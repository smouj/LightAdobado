name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        run: choco install nasm -y --no-progress
      - name: Build
        run: cargo build --release --locked -p lightcraft
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem target/release/lightcraft.exe -ErrorAction SilentlyContinue
          if (-not $exe) { $exe = Get-ChildItem target/release/*.exe | Select-Object -First 1 }
          Copy-Item $exe.FullName "dist/LightAdobado.exe"
          Get-ChildItem LICENSE*,NOTICE,ATTRIBUTION.md -ErrorAction SilentlyContinue | Copy-Item -Destination dist
          Compress-Archive -Path dist/* -DestinationPath LightAdobado-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LightAdobado-windows-x64
          path: LightAdobado-windows-x64.zip
          if-no-files-found: error
